<!doctype html>
<html lang="en" data-skin="royal" data-theme="candy">
<head>
<meta charset="utf-8">
<title></title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8d60fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9).
   v0.9 (аудит графики, мокап GPT): яркий фиолетовый фон; ПАНЕЛЬ ЦЕЛИ — тёплая кремовая с золотой кромкой (заказы, ящики, лоток);
   ПОЛЕ — глубокий сине-фиолетовый лоток. Нужные заказу плитки — из «бумаги» карточек с оранжевой кромкой. Одна тема (тёмной нет: средние тона). */
:root{
  --bg:#4b34b8; --frame:#7552ee; --frame-top:#8d60fa; --ink:#ffffff; --muted:#e3dcff;
  --accent:#fb7f12; --off:rgba(255,255,255,.16); --danger:#ff4f5e;
  --board:#302d94; --board-shadow:#211e6e; --slot:#423db0; --tile:#fbf8fa; --tile-shadow:#bcb3cf; --stone:#8d93bd; --stone-dark:#6f75a3;
  --c0:#ff5470; --c1:#3b8cff; --c2:#ffb81f; --c3:#2fbf71; --c4:#9b5cff;
  --paper:#fff4d2; --paper-shadow:#e0a94f; --panel-ink:#5a3a1c; --panel-muted:#b3a487; --panel-slot:#f2dcaa;   /* карточка заказа: бумага, её бортик, чернила, лунка */
  --goal:#fde7ae; --goal-shadow:#c8893a; --goal-rim:#ffd75e;                                                  /* панель цели (заказы + лоток): кремовая, золотая кромка, бортик */
  --tray-deep:#c98a45; --tray-bed:#ebb36f; --tray-slot:#f6d39a;                                              /* лоток в панели: кромка, дно, лунка */
  --ghost:#8fe8ff;                                                                                           /* призрак раздачи: голубой пунктир (оранжевое — «нужно заказу») */
  --tray:#ff9a1f;                                                                                             /* лоток: «осталось одно место» */
  --chip:#ffffff; --chip-shadow:rgba(90,50,10,.25);                                                           /* фишка: целая фигура на белом кружке */
  --btn-g:#35c46a; --btn-g-d:#1f8f48; --btn-r:#ff5464; --btn-r-d:#c4303f; --btn-n:#6c76c6; --btn-n-d:#4a5396;   /* кнопки: хорошее, негативное, нейтральное и их «бортики» */
  --btn-b:#4fb0ff; --btn-b-d:#1462d8;                                                                        /* бустеры и шестерёнка — синие объёмные (мокап) */
  --honey:#f7b733; --wood:#c98b4f; --wood-dark:#8f5a2b; --steel:#7d8494; --ok:#2fbf71; --ok-bg:#d9f5e4;
  --frame-w:430px;
}
/* Свой шрифт файлом (замечание бота Proto-vibe): Nunito, латиница, OFL — FONTS-LICENSE.txt рядом с файлом шрифта; в сборке для стора — data-URI */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 'Nunito', system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(180deg,var(--frame-top),var(--frame) 45%,#6a4be6);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px 16px;pointer-events:none;min-height:50px}
header b{font-size:20px;font-weight:900}
header b i{font-style:normal;font-size:12px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--danger);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:3px}
header button{pointer-events:auto}
.gear{display:flex;align-items:center;justify-content:center;width:46px;height:44px;padding:0;border-radius:14px;background:linear-gradient(180deg,#6cc0ff,var(--btn-b));color:#fff;
  box-shadow:0 5px 0 var(--btn-b-d);transition:transform .06s,box-shadow .06s}
.gear:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-b-d)}
.gear svg{width:26px;height:26px;display:block}
.card .gear{position:absolute;right:12px;top:12px}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#boosts{display:flex;gap:14px;justify-content:center;padding:0 14px 2px}
#boosts.hide{display:none}
.boost{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:56px;padding:0;border-radius:18px;background:linear-gradient(180deg,#7fcaff,var(--btn-b));box-shadow:0 6px 0 var(--btn-b-d),0 10px 14px rgba(20,10,80,.3);transition:transform .06s,box-shadow .06s}
.boost:active{transform:translateY(5px);box-shadow:0 1px 0 var(--btn-b-d),0 2px 4px rgba(20,10,80,.3)}
.boost svg{width:32px;height:32px;display:block}
.boost img{height:36px;width:auto;max-width:44px;display:block;pointer-events:none;-webkit-user-drag:none}
.boost.dim img{opacity:.4}
.boost b{position:absolute;right:-7px;top:-7px;min-width:24px;padding:2px 6px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.boost b.ad{background:var(--btn-g);display:flex;align-items:center;gap:2px}
.boost b.ad svg,.adico{width:11px;height:11px;display:inline-block;vertical-align:-1px}
#boosts.pulse .boost{animation:bpulse 1s ease-in-out infinite}
.boost.dim svg{opacity:.4}                                          /* Undo: отменять нечего */   /* бустеры появились впервые — кнопки «дышат», текста нет */
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#frame>#boosts{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45}
/* v0.9: все кнопки объёмные — тень-«бортик» снизу, при нажатии кнопка проседает (сдвиг + тень короче), звук press.
   Цвет по смыслу: g — хорошее и спасительное (Next, Continue, Watch, Resume), r — негативное, куда не зовём (Restart, Quit, No thanks, Retry рядом с Continue),
   n — нейтральное (настройки, вспомогательное). */
.btn{--bc:var(--btn-n);--bs:var(--btn-n-d);position:relative;color:#fff;font-weight:900;background:var(--bc);border-radius:16px;padding:12px 20px;
  box-shadow:0 6px 0 var(--bs),0 9px 14px rgba(20,22,60,.28);transform:translateY(0);transition:transform .06s,box-shadow .06s;text-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn::after{content:'';position:absolute;left:12px;right:12px;top:4px;height:24%;max-height:12px;border-radius:12px;background:rgba(255,255,255,.2);pointer-events:none}   /* блик сверху */
.btn:active,.btn.down{transform:translateY(5px);box-shadow:0 1px 0 var(--bs),0 3px 6px rgba(20,22,60,.25)}
.btn.g{--bc:var(--btn-g);--bs:var(--btn-g-d)} .btn.r{--bc:var(--btn-r);--bs:var(--btn-r-d)} .btn.n{--bc:var(--btn-n);--bs:var(--btn-n-d)}
.btn.small{font-size:15px;padding:9px 18px;border-radius:13px;box-shadow:0 4px 0 var(--bs),0 6px 10px rgba(20,22,60,.25)}
.btn.small:active,.btn.small.down{transform:translateY(3px);box-shadow:0 1px 0 var(--bs)}
.btn.late{visibility:hidden} .btn.late.in{visibility:visible;animation:btnIn .5s cubic-bezier(.25,1.8,.5,1) both}
@keyframes btnIn{from{transform:scale(.55)}to{transform:scale(1)}}   /* старт с видимого состояния (§9): кнопку показывает JS через задержку, а не opacity:0 */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,22,50,.6);padding:20px}
#overlay.show{display:flex}
.card{position:relative;background:var(--frame);border-radius:20px;padding:22px;max-width:340px;width:100%;max-height:100%;overflow-y:auto;text-align:center;
  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px;font-weight:900} .card p{color:var(--muted);margin:0 0 16px}
.card .title{font-size:34px;font-weight:1000;letter-spacing:.01em;margin:6px 0 4px}
.card .logo{width:130px;height:78px;margin:4px auto 2px;display:block}
button.big{font-size:22px;font-weight:1000;padding:16px 26px;border-radius:18px;min-width:220px}
.opts{display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.opts button{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;padding:12px 16px}
.opts button b{font-size:14px;padding:3px 10px;border-radius:10px;background:var(--btn-g);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.opts button b.off{background:rgba(0,0,0,.18);color:#dfe2ff}
.opts button.quiet{justify-content:center}
/* вин-скрин v0.9: без звёзд — «Well done!», собранные фигуры подпрыгивают, Next появляется с задержкой и пружинит */
.card.winc{background:linear-gradient(180deg,#9a74ff,#6c4ce8);box-shadow:0 10px 0 #4a32b0,0 18px 30px rgba(10,10,40,.4);padding:26px 20px 24px;overflow:visible}
.card .wlv{font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#dfe2ff;opacity:.85}
.card .wd{font-size:46px;line-height:1.02;font-weight:1000;margin:6px 0 4px;color:#fff;text-shadow:0 4px 0 #4a32b0;animation:wdIn .55s cubic-bezier(.25,1.7,.5,1) both}
@keyframes wdIn{from{transform:scale(.6) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
.card .figs{display:flex;justify-content:center;gap:6px;margin:14px 0 22px;min-height:60px;flex-wrap:wrap}
.card .figs .fg{position:relative;width:52px;height:56px;animation:hop .6s cubic-bezier(.3,.0,.5,1) both;animation-iteration-count:3}
.card .figs .fg canvas{width:52px;height:52px;display:block}
.card .figs .fg b{position:absolute;right:-4px;bottom:0;font-size:13px;font-weight:1000;background:#fff;color:var(--panel-ink);border-radius:9px;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) scale(1.06,.96)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#overlay{z-index:10}
.card.ad{background:#111;color:#fff} .card.ad .adbig{font-size:64px;font-weight:1000;letter-spacing:.08em;margin:8px 0}
.card.ad .adbar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:12px 0 4px}
.card.ad .adbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:adfill var(--adms,1200ms) linear both}
@keyframes adfill{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
/* Заставка (замечание бота): видна до разбора скриптов; полосу двигает LOADER, обёртке — pfSdk.loadingProgress, на первом кадре — pfSdk.ready() */
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--frame);transition:opacity .3s}
#loading.gone{opacity:0;pointer-events:none}
#loading[hidden]{display:none}
#loading svg{width:150px;height:90px}
#load-title{font-size:32px;font-weight:1000;margin:0}
#load-bar{width:180px;height:8px;border-radius:99px;background:var(--off);overflow:hidden}
#load-fill{height:100%;width:6%;border-radius:99px;background:var(--accent);transition:width .25s ease-out}
#load-logo{display:none}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;max-height:42vh;overflow-y:auto;padding:2px}
.levels .ch{grid-column:1/-1;text-align:left;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.levels button{padding:8px 0;font-size:14px}
.levels button small{display:block;font-size:10px;color:var(--c2)}
.levels button.locked{opacity:.4}
.levels button.hard{box-shadow:inset 0 0 0 2px var(--danger)}
.card .note{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--frame);padding:8px 14px;border-radius:10px;
  pointer-events:none;opacity:.95;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card, #boosts.pulse .boost, .card .wd, .card .figs .fg, .btn.late.in{animation:none} #toast{transition:none} }
#toast{bottom:96px;font-weight:700}
/* Royal-скин («Королевский глянец», мокап GPT A «золотой свет»): светлый замок в расфокусе фоном, поле — синий бархат в золотой рамке,
   панель цели и лоток — дерево с золотом, фигуры — глянцевые «игрушки» GPT. Механика та же; цвета кода — переменные ниже, арт — assets/royal/. */
html[data-skin=royal]{
  --bg:#3b5fae; --frame:#2a4a9e; --frame-top:#7fb2ea; --muted:#e9eefc; --accent:#f39a1d; --danger:#ff4152;
  --board:#1d2f8c; --board-shadow:#121d5c; --slot:#16246f; --tile:#fbfaf6; --tile-shadow:#b9b5c8;
  --paper:#fff1cf; --paper-shadow:#c98a2f; --panel-ink:#4a2a10; --panel-slot:#f3e8d2;
  --goal:#fbf1dc; --goal-shadow:#c9a25a; --goal-rim:#e2b24a; --tray-deep:#e6d2aa; --tray-bed:#f3e6cb; --tray-slot:#fdf7ec;
  --tray:#ff8a00; --chip:#ffffff; --chip-shadow:rgba(60,30,5,.25); --ghost:#2f7fe0;
  --btn-g:#3fca4c; --btn-g-d:#1d8a2c; --btn-r:#ff4f57; --btn-r-d:#b8222e; --btn-n:#6a72b8; --btn-n-d:#424a8a; --btn-b:#2f9cff; --btn-b-d:#1258c4;
}
html[data-skin=royal] body{background:#3b5fae}
html[data-skin=royal] header b{font-size:24px;color:#fff;-webkit-text-stroke:5px #4a2a10;paint-order:stroke fill;text-shadow:0 3px 0 #4a2a10}
html[data-skin=royal] header b i{-webkit-text-stroke:0;text-shadow:none}
html[data-skin=royal] .gear{width:50px;height:50px}
html[data-skin=royal] .gear svg{display:none}
html[data-skin=royal] .boost{width:70px;height:66px}
html[data-skin=royal] .boost img{height:40px;max-width:46px;margin-top:-4px}
html[data-skin=royal] .gear:active,html[data-skin=royal] .boost:active{transform:translateY(4px) scale(.97);box-shadow:none}
html[data-skin=royal] .boost b{border:2px solid #fff;font-weight:1000}
/* кнопки-«конфеты» — спрайты GPT рамкой «9 частей» (border-image): толстые, блик сверху, тёмная кромка; цвет по смыслу тот же */
html[data-skin=royal] .btn::after{display:none}
html[data-skin=royal] .btn:active,html[data-skin=royal] .btn.down{transform:translateY(4px) scale(.98);box-shadow:none;filter:drop-shadow(0 2px 2px rgba(20,22,60,.3))}
html[data-skin=royal] .btn.small{border-width:11px 18px 14px;border-image-width:11px 18px 14px;min-height:44px;box-shadow:none}
html[data-skin=royal] .btn.small:active,html[data-skin=royal] .btn.small.down{transform:translateY(3px);box-shadow:none}
html[data-skin=royal] button.big{min-height:66px}
/* карточки поверх игры — синий бархат в золоте (как поле) */
html[data-skin=royal] #overlay{background:rgba(16,24,70,.55)}
html[data-skin=royal] .card{background:radial-gradient(120% 90% at 50% 30%,#3550b8,#1d2f8c 70%);border:4px solid #ffd35a;box-shadow:0 0 0 3px #a8701c,0 8px 0 3px #6b4310,0 18px 30px rgba(10,10,40,.45)}
html[data-skin=royal] .card.winc{background:radial-gradient(120% 90% at 50% 30%,#3d5cc8,#1d2f8c 72%);box-shadow:0 0 0 3px #a8701c,0 10px 0 3px #6b4310,0 18px 30px rgba(10,10,40,.45)}
html[data-skin=royal] .card .wd{-webkit-text-stroke:6px #6b3a0c;paint-order:stroke fill;color:#ffe066;text-shadow:0 5px 0 #6b3a0c}
html[data-skin=royal] .card h2,html[data-skin=royal] .card .title{-webkit-text-stroke:4px #10195a;paint-order:stroke fill}
html[data-skin=royal] .opts button:not(.btn){background:rgba(8,14,60,.35);box-shadow:inset 0 2px 0 rgba(0,0,0,.2)}
html[data-skin=royal] .card.ad{background:#111;border-color:#333;box-shadow:none}
/* заставка royal (17.11): мгновенный градиент в цветах замка (картинка-замок подтянется из late-стиля), логотип из салюта, полоса в золотой рамке */
html[data-skin=royal] #loading{background:linear-gradient(180deg,#7fb2ea 0%,#bfe0fb 45%,#f4e6cb 100%);gap:26px}
html[data-skin=royal] #loading svg,html[data-skin=royal] #load-title{display:none}
html[data-skin=royal] #load-logo{display:block;width:min(80vw,330px);height:auto;filter:drop-shadow(0 6px 10px rgba(30,40,110,.35));animation:logoIn .5s cubic-bezier(.25,1.7,.5,1) both}
@keyframes logoIn{from{transform:scale(.7)}to{transform:scale(1)}}
html[data-skin=royal] #load-bar{width:min(64vw,240px);height:16px;padding:2px;background:rgba(255,255,255,.6);border:3px solid #e2b24a;box-shadow:0 0 0 2px #a8701c,0 4px 8px rgba(30,40,110,.3)}
html[data-skin=royal] #load-fill{background:linear-gradient(180deg,#ffe98a,#f2a81c);box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
@media (prefers-reduced-motion: reduce){ html[data-skin=royal] #load-logo{animation:none} }
/* вин-скрин royal (17.11, реф Sand Pop): ночь с салютом (#sky внутри оверлея, под карточкой), потом карточка — лента, плашка, панель с лучами */
html[data-skin=royal] #spot{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:15;touch-action:none}
html[data-skin=royal] #sky{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
html[data-skin=royal] #overlay{transition:background .35s}
html[data-skin=royal] #overlay.night{background:radial-gradient(120% 70% at 50% 100%,#2a1f5c 0%,#0e0b2a 55%,#05040f 100%)}
html[data-skin=royal] #overlay.dusk{background:radial-gradient(120% 80% at 50% 60%,rgba(40,30,100,.72),rgba(8,6,30,.86))}
html[data-skin=royal] .card{z-index:1} html[data-skin=royal] .card.rw-hide{display:none}
/* 18.11: карточки победы нет (Андрей: «вин-попап уберём — просто переход на салют» с фразой) — стиль фразы рисует холст #sky */
/* Ривайв и луз (17.11): оверлей без заливки — тень даёт пятно на причине (лоток или поле, красная пульсирующая кромка), карточка снизу */
html[data-skin=royal] #overlay.lz{background:none;align-items:flex-end;padding:10px 12px max(14px,env(safe-area-inset-bottom))}
html[data-skin=royal] #overlay.lz.failed{background:rgba(12,18,56,.68);align-items:center}
html[data-skin=royal] .lz-hole{position:absolute;z-index:0;pointer-events:none;box-shadow:0 0 0 3000px rgba(12,18,56,.62);animation:lzIn .3s ease-out both}
html[data-skin=royal] .lz-hole::after{content:'';position:absolute;inset:-4px;border-radius:inherit;border:4px solid #ff4458;box-shadow:0 0 18px 4px rgba(255,50,70,.65),inset 0 0 14px rgba(255,50,70,.45);animation:lzPulse .8s ease-in-out 3 alternate both}   /* 18.11: три удара и ровно — меньше тревоги */
@keyframes lzIn{from{box-shadow:0 0 0 3000px rgba(12,18,56,0)}}
@keyframes lzPulse{from{opacity:.5}to{opacity:1}}
html[data-skin=royal] .card.rlose{max-width:330px;padding:36px 14px 12px;margin-top:34px;overflow:visible;animation:rlUp .36s .45s cubic-bezier(.2,1.4,.5,1) both}
html[data-skin=royal] .card.rlose.board,html[data-skin=royal] .card.rlose.timer{animation-delay:.8s}   /* поле забито: сначала видно поле в красной кромке */
html[data-skin=royal] .card.rlose.failed,html[data-skin=royal] .card.rlose.giveup,html[data-skin=royal] .card.rlose.quick{animation-delay:0s}
html[data-skin=royal] .rl-2l{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
html[data-skin=royal] .rl-2l small{font-size:13px;font-weight:900;margin-top:3px;-webkit-text-stroke:2.5px rgba(0,0,0,.35);opacity:.95}
@keyframes rlUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
html[data-skin=royal] .rl-ribbon{position:absolute;left:-22px;right:-22px;top:-34px}
@media (max-width:380px){ html[data-skin=royal] .rl-ribbon{left:-12px;right:-12px} }
html[data-skin=royal] .rl-ribbon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 3px rgba(40,0,10,.4))}
html[data-skin=royal] .rl-ribbon span{position:absolute;left:12%;right:12%;top:2.6%;height:70.5%;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:1000;color:#fff;
  -webkit-text-stroke:6px #6b2a08;paint-order:stroke fill;text-shadow:0 4px 0 #5a1f05;line-height:1;white-space:nowrap}
html[data-skin=royal] .rl-ribbon.fail span{-webkit-text-stroke-color:#2a3048;text-shadow:0 4px 0 #222838}
html[data-skin=royal] .rl-level{display:inline-block;margin:2px 0 14px;padding:3px 20px;border-radius:12px;background:#1a2470;border:2px solid #ffd35a;font-size:18px;font-weight:1000;color:#fff}
/* 18.11: карточка ривайва — одна мысль: «Only N left!» и сами фигуры крупно (без полосы, «что даст», подзаголовка и счётчика) */
html[data-skin=royal] .rl-left{font-size:27px;font-weight:1000;color:#fff;-webkit-text-stroke:5px #10195a;paint-order:stroke fill;line-height:1.15;margin:4px 0 6px}
html[data-skin=royal] .rl-left b{color:#ffe14d;font-size:33px}
html[data-skin=royal] .rl-want{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 12px}
html[data-skin=royal] .rl-want canvas{width:66px;height:66px;filter:drop-shadow(0 0 9px rgba(255,226,120,.5))}
html[data-skin=royal] .rl-want.n1 canvas{width:80px;height:80px} html[data-skin=royal] .rl-want.n3 canvas{width:60px;height:60px}
html[data-skin=royal] .rl-want b{font-size:24px;font-weight:1000;color:#fff;-webkit-text-stroke:4px #10195a;paint-order:stroke fill;margin-left:4px}
html[data-skin=royal] .rl-line{font-size:18px;font-weight:900;color:#ffd7cf;-webkit-text-stroke:3.5px #10195a;paint-order:stroke fill;margin:6px 0 14px}
html[data-skin=royal] .rl-go{position:relative;width:100%;max-width:300px;min-height:72px;font-size:30px}
html[data-skin=royal] .rl-free{display:inline-block;margin-left:8px;padding:1px 8px 2px;border-radius:9px;background:#ffe14d;color:#7a4204;font-style:normal;font-size:16px;font-weight:1000;
  -webkit-text-stroke:0;text-shadow:none;vertical-align:3px;box-shadow:0 2px 0 #b07a10}
html[data-skin=royal] .rl-ad{display:inline-flex;width:26px;height:26px;margin-right:8px;border-radius:50%;background:#fff;color:#2a9a3c;align-items:center;justify-content:center;vertical-align:-3px;-webkit-text-stroke:0}
html[data-skin=royal] .rl-ad .adico{width:13px;height:13px;margin-left:2px}
html[data-skin=royal] .rl-low{margin-top:6px}
@media (max-height:680px){ html[data-skin=royal] .card.rlose{padding-top:32px} html[data-skin=royal] .rl-want{margin-bottom:8px} html[data-skin=royal] .rl-go{min-height:64px} }
@media (prefers-reduced-motion: reduce){ html[data-skin=royal] .card.rlose, html[data-skin=royal] .lz-hole, html[data-skin=royal] .lz-hole::after{animation:none} }
/* Candy-скин («Леденцовый глянец», 18.11, мокап GPT B «сахарный леденец»): вся вёрстка и поведение royal (data-skin=royal), поверх — html[data-theme=candy].
   Фон — кондитерская в расфокусе, поле — светлая мята, панель цели — розовая глазурь, фигуры — леденцы со спиралью (арт assets/candy/).
   Карточки поверх игры — ягодный джем вместо синего бархата; ночь салюта — сливовая. */
html[data-skin=royal][data-theme=candy]{
  --bg:#f3c6d9; --frame:#d94f8b; --frame-top:#ffd9e8; --accent:#ff8a1f; --danger:#ff3b5c;
  --c0:#ff3d5e; --c1:#2f8cff; --c2:#ffb21a; --c3:#2cc46a; --c4:#a15cff;
  --honey:#f2a33a; --wood:#ff86b4; --wood-dark:#d4467f; --steel:#9c2238; --stone:#7a4a2e; --stone-dark:#4f2c18;
  --btn-b:#ff5fa2; --btn-b-d:#c42a6e; --ghost:#2f7fe0; --ok:#2cbf63;
}
html[data-skin=royal][data-theme=candy] body{background:#f3c6d9}
html[data-skin=royal][data-theme=candy] header b{-webkit-text-stroke:5px #5b2512;text-shadow:0 3px 0 #5b2512}
html[data-skin=royal][data-theme=candy] #overlay{background:rgba(74,16,52,.5)}
html[data-skin=royal][data-theme=candy] .card{background:radial-gradient(120% 90% at 50% 28%,#ee6aa2,#b42a6b 72%);border:4px solid #ffe0ec;box-shadow:0 0 0 3px #c2457e,0 8px 0 3px #74163f,0 18px 30px rgba(60,10,40,.45)}
html[data-skin=royal][data-theme=candy] .card h2,html[data-skin=royal][data-theme=candy] .card .title{-webkit-text-stroke-color:#5e0f36}
html[data-skin=royal][data-theme=candy] .opts button:not(.btn){background:rgba(90,10,50,.28)}
html[data-skin=royal][data-theme=candy] .card.ad{background:#111;border-color:#333;box-shadow:none}
html[data-skin=royal][data-theme=candy] #overlay.night{background:radial-gradient(120% 70% at 50% 100%,#3d1a4f 0%,#170a26 55%,#08040e 100%)}
html[data-skin=royal][data-theme=candy] #overlay.dusk{background:radial-gradient(120% 80% at 50% 60%,rgba(90,30,90,.72),rgba(20,6,28,.86))}
html[data-skin=royal][data-theme=candy] #overlay.lz.failed{background:rgba(60,12,42,.68)}
html[data-skin=royal][data-theme=candy] .lz-hole{box-shadow:0 0 0 3000px rgba(60,12,42,.6)}
html[data-skin=royal][data-theme=candy] .rl-level{background:#7e1a4c;border-color:#ffd6e6}
html[data-skin=royal][data-theme=candy] .rl-left,html[data-skin=royal][data-theme=candy] .rl-want b,html[data-skin=royal][data-theme=candy] .rl-line{-webkit-text-stroke-color:#5e0f36}
/* заставка candy: мгновенный градиент в цветах кондитерской (картинка подтянется из late-стиля), логотип-леденец, полоса в розовой глазури */
html[data-skin=royal][data-theme=candy] #loading{background:linear-gradient(180deg,#ffd6e6 0%,#fff0f5 48%,#d6f3e1 100%)}
html[data-skin=royal][data-theme=candy] #load-logo{display:none}
#load-logo-c{display:none}
html[data-skin=royal][data-theme=candy] #load-logo-c{display:block;width:min(80vw,330px);height:auto;filter:drop-shadow(0 0 2px rgba(140,20,80,.45)) drop-shadow(0 6px 12px rgba(150,30,90,.45));animation:logoIn .5s cubic-bezier(.25,1.7,.5,1) both}
html[data-skin=royal][data-theme=candy] #load-bar{background:rgba(255,255,255,.75);border-color:#ff8fbd;box-shadow:0 0 0 2px #c2457e,0 4px 8px rgba(150,30,90,.25)}
html[data-skin=royal][data-theme=candy] #load-fill{background:repeating-linear-gradient(-45deg,#ff6fa8 0 8px,#ff9cc5 8px 16px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
@media (prefers-reduced-motion: reduce){ html[data-skin=royal][data-theme=candy] #load-logo-c{animation:none} }
</style>

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Половинки». Поле w×h, в клетках — пусто, камень или плитка с половинкой фигуры.
// Свайп двигает плитку до упора (стена, камень, другая плитка). Если после остановки
// левая половинка стоит вплотную слева от правой того же цвета — стыковка: обе исчезают,
// целая фигура уходит в открытый заказ, которому она нужна. Фигура, которую никто не заказал, ложится
// в лоток (cap мест) и сама уйдёт в заказ, когда такой откроется; места в лотке нет — проигрыш.
// После хода без стыковки (CFG.DEAL = 'miss', с v0.8; 'each' — после каждого every-го хода) на поле падает новая половинка в клетку с искрой (видно заранее).
// Цель — закрыть все заказы очереди (и сломать ящики, если есть). Проигрыш — поле забито (пустых клеток нет и ходить некуда)
// или лишняя фигура не влезла в лоток. Если ходить нечем, а место на поле есть, раздача падает сама (topUp) — это не проигрыш.
// Коды клеток: 0 — пусто, -1 — камень, -2 — ящик, половинка — см. pieceCode ниже.
// Ход — число m = клетка*4 + направление (0 →, 1 ←, 2 ↓, 3 ↑).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила, солвер, генератор ---
  PAR_BEAM: 40,        // ширина луча солвера в игре (par для звёзд); оффлайн-аудит берёт SIM_BEAM
  SIM_BEAM: 300,       // ширина луча солвера в sim.mjs
  MAX_DEPTH: 60,       // предел глубины солвера (ходов)
  BOT_CAP: 150,        // предел ходов ботов: на уровнях без раздачи иначе можно ходить вечно
  GEN_ATTEMPTS: 80,    // попыток собрать поле на один сид, прежде чем взять последнее
  TRAY_CAP: 4,         // мест в лотке: фигура, которую никто не заказал, ждёт здесь; не поместилась — проигрыш
  ORDER_SHOW: 2,       // сколько заказов открыто одновременно
  WANT: 0.5,           // доля раздач, цвет которых берётся из открытых заказов (остальные — любой цвет уровня)
  DEAL: 'miss',        // когда падает раздача: 'miss' — только после хода без стыковки (v0.8, решение Андрея); 'each' — после каждого хода; 'second' — через ход
  TRAY_PLUS: 0,        // добавка к лотку на всех уровнях (удалённый ключ tray_cap − TRAY_CAP; только ≥ 0 — только легче)
  WANT_BONUS: 0,       // сдвиг доли нужных раздач want на уровнях с раздачей (удалённый ключ want_bonus, −0,5…0,5)
  // --- сложность по уровням (17.11, Андрей: «вынесем сложность в ремоут конфиг»); применяет tuneSpec при создании уровня, удалённые ключи — в скобках ---
  ASSIST_UNTIL: 5,     // до какого уровня (номер игры) раздача «под пару» и догонялка (assist_until_level); с 6-го — обычная раздача
  ASSIST_PAIR: 0.3,    // вероятность укладки «под пару» на этих уровнях (assist_pair_chance, 0…1); 18.11: было 1 — «безбожно подыгрывают»
  CATCHUP_AFTER: 3,    // догонялка (принудительная половинка под заказ) — только если столько ходов подряд без стыковки и на поле нет ни одной стыковки (catchup_after_moves)
  END_GAP_P: 0.5,       // конец уровня (очередь заказов исчерпана): после раздачи нужного цвета с этой вероятностью следующая — «чужого» цвета, после неё нужный — точно (не видно, что игра подыгрывает)

const STONE = -1, CRATE = -2;                              // помехи: камень вечный, ящик ломается стыковкой рядом
const HONEY = 1;                                           // пол (массив floor): мёд — плитка на нём останавливается
const RAINBOW = 5;                                         // «цвет» радужной половинки: стыкуется с любым цветом
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];          // → ← ↓ ↑
// Код плитки: 1 + цвет*4 + сторона (0 левая, 1 правая, 2 верхняя, 3 нижняя); +100 — в цепи; +1000*t — таймер на t ходов.
const pieceCode = (color, side, chain, timer) => 1 + color * 4 + side + (chain ? 100 : 0) + (timer ? 1000 * timer : 0);
const colorOf = (code) => ((code % 100) - 1) >> 2;
const sideOf = (code) => ((code % 100) - 1) & 3;
const isChained = (code) => code > 0 && Math.floor((code % 1000) / 100) === 1;
const timerOf = (code) => code > 0 ? Math.floor(code / 1000) : 0;
const isVert = (code) => sideOf(code) >= 2;

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Случайное число без состояния: раздача зависит только от (сид уровня, номер раздачи, соль).
function hashRand(seed, k, salt){
  return mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA77)) >>> 0)();
}

// После таблицы — по кругу с LOOP_FROM: уровень 101 повторяет LOOP_FROM, 102 — следующий и т. д. Поле и заказы те же
// (сид от номера уровня таблицы), номер на экране — li + 1.
function levelSpec(li){
  if (li < LEVELS.length) return LEVELS[li];
  const a = Math.max(0, Math.min(LEVELS.length - 1, CFG.LOOP_FROM - 1)), len = LEVELS.length - a;
  return LEVELS[a + (li - LEVELS.length) % len];
}

// --- раскладка уровня ---
const LAYOUT_CHARS = 'hcsdlr';                            // r — радужная (цвет RAINBOW = 5)
function parseLayout(rows){
  const toks = rows.map(r => r.indexOf(' ') >= 0 ? r.trim().split(/\s+/) : r.split(''));
  const h = toks.length, w = toks[0].length, grid = new Array(w * h).fill(0), floor = new Array(w * h).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let t = toks[y][x]; const i = y * w + x;
    if (t[0] === '~'){ floor[i] = HONEY; t = t.slice(1); if (!t) continue; }
    if (t === '.') continue;
    if (t === '#'){ grid[i] = STONE; continue; }
    if (t === 'x'){ grid[i] = CRATE; continue; }
    const col = LAYOUT_CHARS.indexOf(t[0].toLowerCase());
    if (col < 0) throw new Error('layout: неизвестный токен ' + t);
    const first = t[0] === t[0].toLowerCase(), vert = t.indexOf('^') >= 0, chain = t.indexOf('*') >= 0;
    const tm = t.match(/\d+/);
    grid[i] = pieceCode(col, (vert ? 2 : 0) + (first ? 0 : 1), chain, tm ? +tm[0] : 0);
  }
  return { grid, w, h, floor };
}
function cellToken(s, i){
  const c = s.grid[i], hon = s.floor && s.floor[i] === HONEY ? '~' : '';
  if (c === 0) return hon || '.';
  if (c === STONE) return hon + '#';
  if (c === CRATE) return hon + 'x';
  const ch = LAYOUT_CHARS[colorOf(c)], sd = sideOf(c);
  return hon + (sd === 0 || sd === 2 ? ch : ch.toUpperCase()) + (sd >= 2 ? '^' : '') + (isChained(c) ? '*' : '') + (timerOf(c) || '');
}
function gridRows(s){
  const out = [];
  for (let y = 0; y < s.h; y++){ const r = []; for (let x = 0; x < s.w; x++) r.push(cellToken(s, y * s.w + x)); out.push(r.join(' ')); }
  return out;
}

// --- движение и стыковка ---
// Куда доедет плитка из клетки i в направлении d: до стены, до занятой клетки или до мёда (на мёде останавливается).
function slideDest(grid, w, h, i, d, floor){
  const dx = DIRS[d][0], dy = DIRS[d][1];
  let x = i % w, y = (i - x) / w;
  for (;;){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h || grid[ny * w + nx] !== 0) break;
    x = nx; y = ny;
    if (floor && floor[y * w + x] === HONEY) break;
  }
  return y * w + x;
}
const colorsMatch = (a, b) => { const ca = colorOf(a), cb = colorOf(b); return ca === cb || ca === RAINBOW || cb === RAINBOW; };
// Пара для половинки code в клетке j: левой нужна правая справа, правой — левая слева, верхней — нижняя снизу, нижней — верхняя сверху.
function dockPartner(grid, w, h, j, code){
  if (code <= 0) return -1;
  const x = j % w, y = (j - x) / w, sd = sideOf(code);
  let k = -1, want = -1;
  if (sd === 0 && x < w - 1){ k = j + 1; want = 1; }
  else if (sd === 1 && x > 0){ k = j - 1; want = 0; }
  else if (sd === 2 && y < h - 1){ k = j + w; want = 3; }
  else if (sd === 3 && y > 0){ k = j - w; want = 2; }
  if (k < 0) return -1;
  const n = grid[k];
  return n > 0 && sideOf(n) === want && colorsMatch(code, n) ? k : -1;
}
function hasDock(grid, w, h){ for (let i = 0; i < grid.length; i++){ const c = grid[i]; if (c > 0 && (sideOf(c) === 0 || sideOf(c) === 2) && dockPartner(grid, w, h, i, c) >= 0) return true; } return false; }
function nearestEmpty(grid, w, from){
  let best = -1, bd = Infinity; const fx = from % w, fy = (from - fx) / w;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] !== 0) continue;
    const x = i % w, dd = Math.abs(x - fx) + Math.abs((i - x) / w - fy);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}
function pieceCount(s){ let n = 0; for (const c of s.grid) if (c > 0) n++; return n; }
function neighbors4(i, w, h){ const x = i % w, y = (i - x) / w, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < h - 1) o.push(i + w); return o; }

// --- заказы и лоток ---
// Заказ — { id, c: [цвета], f: [закрыто?] }. Открыто show заказов (слоты s.active, пустой слот — null); очередь — s.queue.
function newOrder(s){ const c = s.queue[s.oi]; return { id: s.oi++, c, f: c.map(() => false) }; }
// Кладёт фигуру цвета col в первый открытый заказ, где она нужна (радужная целая подходит в любое место). Нет места — null.
// Фигура уходит в тот открытый заказ, которому она нужна и который ближе всего к завершению (меньше всего пустых мест);
// при равенстве — в старший в очереди (меньший id). Решение Андрея 17.11: «дособирать почти готовый заказ, чем начинать новый».
// Одно правило для стыковки, отдачи из лотка (settle), магнита и «Продолжить» — все идут через place.
function place(s, col){
  let best = null;
  for (let a = 0; a < s.active.length; a++){
    const o = s.active[a]; if (!o) continue;
    let k = -1, left = 0;
    for (let i = 0; i < o.c.length; i++) if (!o.f[i]){ left++; if (k < 0 && (o.c[i] === col || col === RAINBOW)) k = i; }
    if (k < 0) continue;
    if (!best || left < best.left || (left === best.left && o.id < best.o.id)) best = { a, k, o, left };
  }
  if (!best) return null;
  best.o.f[best.k] = true; s.served++;
  return { kind: 'order', slot: best.a, k: best.k, id: best.o.id, color: best.o.c[best.k] };
}
// Какие цвета сейчас нужны открытым заказам.
function wantedColors(s){ const w = [false, false, false, false, false]; for (const o of s.active) if (o) o.c.forEach((c, k) => { if (!o.f[k]) w[c] = true; }); return w; }
function ordersLeft(s){ return s.active.some(Boolean); }
// Закрытые заказы уходят, на их место встают следующие из очереди, лоток отдаёт подошедшие фигуры — пока что-то меняется.
function settle(s, ev, by){
  for (let guard = 0; guard < 60; guard++){
    let changed = false;
    for (let a = 0; a < s.active.length; a++){
      const o = s.active[a]; if (!o || !o.f.every(Boolean)) continue;
      ev.push({ type: 'done', slot: a, id: o.id, by });
      s.active[a] = s.oi < s.queue.length ? newOrder(s) : null;
      if (s.active[a]) ev.push({ type: 'order', slot: a, id: s.active[a].id, by });
      changed = true;
    }
    for (let t = 0; t < s.tray.length; t++){
      const hit = place(s, s.tray[t]); if (!hit) continue;
      ev.push({ type: 'untray', color: s.tray[t], from: t, slot: hit.slot, k: hit.k, id: hit.id, by });
      s.tray.splice(t, 1); changed = true; break;
    }
    if (!changed) break;
  }
}
// Куда идёт целая фигура: в заказ, в лоток, мимо (заказов не осталось) или «не поместилась» (лоток полон — проигрыш).
function deliver(s, col, ev, by){
  const hit = place(s, col);
  if (hit){ settle(s, ev, by); return hit; }
  if (!ordersLeft(s)) return { kind: 'bonus' };
  if (s.tray.length >= s.cap){ s.trayOver = true; return { kind: 'over' }; }
  s.tray.push(col);
  return { kind: 'tray', k: s.tray.length - 1 };
}
// Стыковка a+b: целая фигура (радужная берёт цвет пары) уходит по deliver, рядом ломаются ящики и снимаются цепи.
// ev — события для оболочки; by — кто стыковал ('move' | 'spawn' | 'boost'). Возвращает { color, target }.
function dock(s, a, b, ev, by){
  const ca = colorOf(s.grid[a]), cb = colorOf(s.grid[b]), col = ca === RAINBOW ? cb : ca;
  s.grid[a] = 0; s.grid[b] = 0; s.docks++;
  for (const c of [a, b]) for (const k of neighbors4(c, s.w, s.h)){
    const v = s.grid[k];
    if (v === CRATE){ s.grid[k] = 0; s.crates++; ev.push({ type: 'crate', cell: k, by }); }
    else if (isChained(v)){ s.grid[k] = v - 100; ev.push({ type: 'chain', cell: k, code: v, by }); }
  }
  const target = deliver(s, col, ev, by);
  return { color: target.kind === 'order' ? target.color : col, target };
}
// Таймеры: после хода каждый тикает; дошёл до нуля — плитка каменеет.
function tickTimers(s, ev){
  for (let i = 0; i < s.grid.length; i++){
    const t = timerOf(s.grid[i]); if (!t) continue;
    if (t === 1){ ev.push({ type: 'stone', cell: i, code: s.grid[i] }); s.grid[i] = STONE; if (!s.every) s.dead = true; }
    else s.grid[i] -= 1000;
  }
}

// Следующая раздача: какая половинка и куда. Решается сразу после хода — игрок видит её заранее.
// С вероятностью help — пара к одинокой половинке на поле, иначе новая; с вероятностью want цвет берётся из открытых заказов.
function planNext(s){
  const empties = [];
  for (let i = 0; i < s.grid.length; i++) if (s.grid[i] === 0) empties.push(i);
  const bal = [];                                    // [цвет][ось]: >0 — первых (левых/верхних) больше
  for (let c = 0; c < s.colors; c++) bal.push([0, 0]);
  for (const c of s.grid) if (c > 0 && colorOf(c) < s.colors){ const sd = sideOf(c); bal[colorOf(c)][sd >> 1] += (sd & 1) ? -1 : 1; }
  const W = wantedColors(s), end = s.oi >= s.queue.length && ordersLeft(s);
  const other = []; for (let c = 0; c < s.colors; c++) if (!W[c]) other.push(c);
  const gap = end && s.gap > 0 && other.length > 0;      // конец уровня: сейчас — «чужой» цвет (между нужными 1–2 чужих, 18.11)
  const biased = !gap && ((end && s.due) || hashRand(s.seed, s.k, 7) < s.want);   // после «чужих» — нужный цвет точно (чередование, без длинных серий чужих)
  let lonely = [];
  for (let c = 0; c < s.colors; c++) for (let ax = 0; ax < 2; ax++) if (bal[c][ax]) lonely.push([c, ax]);
  let code; const near = s.near && (s.nearP >= 1 || hashRand(s.seed, s.k, 11) < s.nearP);   // «под пару» в этой раздаче (вероятность nearP)
  if (gap) lonely = lonely.filter(q => !W[q[0]]);
  if (lonely.length && hashRand(s.seed, s.k, 1) < s.help){
    const lw = lonely.filter(q => W[q[0]]); if (biased && lw.length) lonely = lw;
    if (near){ const ok = lonely.filter(q => lineFits(s, pieceCode(q[0], q[1] * 2 + (bal[q[0]][q[1]] > 0 ? 1 : 0)))); if (ok.length) lonely = ok; }   // урок: пару даём той, к которой можно встать в ряд (не прижатой к «не той» стене)
    const [col, ax] = lonely[Math.floor(hashRand(s.seed, s.k, 2) * lonely.length)];
    const side = ax * 2 + (bal[col][ax] > 0 ? 1 : 0);
    code = pieceCode(!gap && s.rainbow && hashRand(s.seed, s.k, 6) < s.rainbow ? RAINBOW : col, side);
  } else {
    let col = gap ? other[Math.floor(hashRand(s.seed, s.k, 3) * other.length)] : Math.floor(hashRand(s.seed, s.k, 3) * s.colors);
    const want = []; for (let c = 0; c < s.colors; c++) if (W[c]) want.push(c);
    if (biased && want.length) col = want[Math.floor(hashRand(s.seed, s.k, 8) * want.length)];
    const ax = s.vert && hashRand(s.seed, s.k, 9) < s.vert ? 1 : 0;
    code = pieceCode(col, ax * 2 + (hashRand(s.seed, s.k, 4) < 0.5 ? 0 : 1));
  }
  if (end){ const c = colorOf(code); if (c === RAINBOW || W[c]){ s.gap = hashRand(s.seed, s.k, 13) < CFG.END_GAP_P ? 1 : 0; s.due = false; }
    else if (s.gap > 0 && --s.gap === 0) s.due = true; }
  if (s.timerP && hashRand(s.seed, s.k, 10) < s.timerP) code += 1000 * s.timer;
  let cell = empties.length ? empties[Math.floor(hashRand(s.seed, s.k, 5) * empties.length)] : -1;
  if (near && cell >= 0) cell = nearCell(s, code, cell);
  s.next = { code, cell, near };                     // near — клетка выбрана «под пару» (для замера audit/assist.mjs)
}
// Раздача «под пару» (урок раздачи, spec.near): клетка, встав в которую, новая половинка стыкуется со своей парой одним свайпом
// (её или пары) — в ряд или в столбец с парой, путь свободен. Сразу вплотную (сама состыкуется) — только если иначе нельзя.
// Из подходящих — ближайшая к pref (призрак не прыгает). Нет подходящих — pref.
function dockInOne(s){
  const { grid, w, h, floor } = s;
  for (let i = 0; i < grid.length; i++){
    if (grid[i] <= 0 || isChained(grid[i])) continue;
    for (let d = 0; d < 4; d++){ const j = slideDest(grid, w, h, i, d, floor); if (j !== i && dockPartner(grid, w, h, j, grid[i]) >= 0) return true; }
  }
  return false;
}
let NEAR_DEPTH = 0;                                  // > 0 — идёт проверка ходов внутри правила «под пару»: вложенные applyMove его не применяют
// Половинка «для заказа» (17.11): какую половинку нужного заказам цвета и в какую клетку положить, чтобы появилась стыковка под заказ одним свайпом.
// Сначала — места, где пару соберёт сам игрок (не вплотную), ближе к from; иначе — вплотную (стыкуется сама, «Подарок!»). null — некуда.
function orderHalf(s, from){
  const W = wantedColors(s), sides = s.vert ? 4 : 2, fx = from % s.w, fy = (from - fx) / s.w, nr = s.near; let best = null;
  s.near = false;                                   // проверка ходов внутри (orderMoves → applyMove) это правило не запускает
  for (let col = 0; col < 5; col++){ if (!W[col]) continue;
    for (let sd = 0; sd < sides; sd++){ const code = pieceCode(col, sd);
      for (let i = 0; i < s.grid.length; i++){ if (s.grid[i] !== 0) continue;
        s.grid[i] = code; const touch = dockPartner(s.grid, s.w, s.h, i, code) >= 0, ok = touch || orderMoves(s).length > 0; s.grid[i] = 0;
        if (!ok) continue;
        const x = i % s.w, sc = (touch ? 100 : 0) + Math.abs(x - fx) + Math.abs((i - x) / s.w - fy);
        if (!best || sc < best.sc) best = { code, cell: i, sc };

  s.near = nr;
  return best && { code: best.code, cell: best.cell };
}
// Пара нужного заказу цвета целиком: левая и правая половинки в одном ряду, между ними пусто и есть зазор — один свайп стыкует. Ближе к from.
function orderPair(s, from){
  const W = wantedColors(s), fx = from % s.w, fy = (from - fx) / s.w; let best = null;
  const col = W.findIndex(Boolean); if (col < 0) return [];
  for (let y = 0; y < s.h; y++) for (let a = 0; a < s.w; a++) for (let b = a + 2; b < s.w; b++){
    let ok = true; for (let x = a; x <= b; x++) if (s.grid[y * s.w + x] !== 0){ ok = false; break; }
    if (!ok) continue;
    const sc = Math.abs((a + b) / 2 - fx) + Math.abs(y - fy) + (b - a) * 0.1;
    if (!best || sc < best.sc) best = { sc, l: y * s.w + a, r: y * s.w + b };

  return best ? [{ code: pieceCode(col, 0), cell: best.l }, { code: pieceCode(col, 1), cell: best.r }] : [];
}
// Пара в ряд: в той же строке (левая/правая) или столбце (верх/низ) с нужной стороны стоит пара, между ними пусто и есть зазор — свайп любой из двух стыкует.
function inLine(s, i, code){
  const w = s.w, x = i % w, y = (i - x) / w, sd = sideOf(code), dx = sd === 0 ? 1 : sd === 1 ? -1 : 0, dy = sd === 2 ? 1 : sd === 3 ? -1 : 0;
  for (let k = 1, cx = x + dx, cy = y + dy; cx >= 0 && cy >= 0 && cx < w && cy < s.h; k++, cx += dx, cy += dy){
    const c = s.grid[cy * w + cx]; if (c === 0) continue;
    return k >= 2 && c > 0 && sideOf(c) === (sd ^ 1) && colorsMatch(code, c) && !isChained(c);
  }

  n.trayOver = false; const cleared = n.tray.slice(); n.tray = [];

    const p = magnetPair(n, true); if (!p) break;
    const aCode = n.grid[p[0]], bCode = n.grid[p[1]], dk = dock(n, p[0], p[1], ev, 'boost');

// Солвер: поиск лучом по слоям глубины (каждый слой — ход). Возвращает список ходов или null.
// Первый найденный выигрыш — самый короткий среди просмотренных; при узком луче это «лучшее найденное», не точный минимум.
function stateKey(s){
  return s.grid.join(',') + '|' + (s.next ? s.next.code + ':' + s.next.cell : '') + '|' + s.crates + '|' + s.tray.join('') + '|' +
    s.active.map(o => o ? o.id + ':' + o.f.map(b => b ? 1 : 0).join('') : '-').join('/') + '|' + (s.every ? s.moves % s.every : 0);
}
// Тесно на поле и в лотке — чем ближе к краю, тем дороже следующая плитка (квадрат): так боты и солвер берегут место.
function crowding(s){ const p = pieceCount(s), t = s.tray.length; return p * p / 6 + t * t * 4 + (t >= s.cap ? 30 : 0); }

function solve(s0, width){
  width = width || CFG.PAR_BEAM;

  let beam = [{ s: s0, path: [] }];
  const seen = new Set([stateKey(s0)]);
  for (let depth = 0; depth < CFG.MAX_DEPTH; depth++){
    const cand = [];
    for (const node of beam){
      for (const m of legalMoves(node.s)){
        const n = applyMove(node.s, m), key = stateKey(n);
        if (seen.has(key)) continue;
        seen.add(key);
        const path = node.path.concat(m);
        if (isWin(n)) return path;
        if (isLose(n)) continue;
        cand.push({ s: n, path, sc: scoreState(n) });
      }
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.sc - a.sc);
    beam = cand.slice(0, width);
  }
  return null;
}

// Боты для симулятора (PROTO-BASE §6). Все возвращают метрики ощущения, не только исход.
//   random — любой ход;
//   novice — стыкует всё готовое, что видит (сначала под заказ, лишнее — пока есть место в лотке); иначе любой ход, кроме явного переполнения;
//   docker — «стыкуй всё»: любая готовая стыковка, даже в полный лоток, а без неё — ход, который готовит стыковку (цена выбора);
//   greedy — на шаг вперёд: прогресс заказов, готовые стыковки под заказ, место на поле и в лотке;
//   midNN — в NN% ходов думает как greedy, в остальных как novice (mid50 — «средний игрок»).
function greedyPick(s){
  let best = -1, bs = -Infinity;
  const p0 = goalProgress(s).done;
  for (const m of legalMoves(s)){
    const n = applyMove(s, m);
    if (isWin(n)) return m;
    const sc = isLose(n) ? -1e9 : (goalProgress(n).done - p0) * 1000 + orderMoves(n).length * 12 - crowding(n);
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
function dockerPick(s, rnd){
  const dm = dockMoves(s), om = dm.filter(m => moveKind(s, m) !== 'tray' && moveKind(s, m) !== 'over');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  if (dm.length) return dm[Math.floor(rnd() * dm.length)];
  let best = -1, bs = -Infinity;
  for (const m of legalMoves(s)){ const n = applyMove(s, m), sc = isLose(n) ? -1e9 : dockMoves(n).length * 10 - pieceCount(n) + rnd(); if (sc > bs){ bs = sc; best = m; } }
  return best;
}
function novicePick(s, rnd){
  const moves = legalMoves(s), kinds = moves.map(m => moveKind(s, m));
  const om = moves.filter((m, k) => kinds[k] === 'order' || kinds[k] === 'bonus');
  if (om.length) return om[Math.floor(rnd() * om.length)];
  const tm = moves.filter((m, k) => kinds[k] === 'tray'); if (tm.length) return tm[Math.floor(rnd() * tm.length)];
  const safe = moves.filter((m, k) => kinds[k] !== 'over'), pool = safe.length ? safe : moves;

function playBot(s, policy, seed){
  const rnd = mulberry32(seed || 1), think = policy === 'greedy' ? 1 : policy.slice(0, 3) === 'mid' ? (Number(policy.slice(3)) || 50) / 100 : 0;

  while (!isWin(s) && !isLose(s) && steps < CFG.BOT_CAP){
    if (orderMoves(s).length) withDock++;

    let m;

    else if (policy === 'docker') m = dockerPick(s, rnd);
    else if (think && rnd() < think) m = greedyPick(s);
    else m = novicePick(s, rnd);
    const d0 = s.docks;
    s = applyMove(s, m); steps++;
    if (firstDock < 0 && s.docks > d0) firstDock = steps;
    if (s.tray.length > trayPeak) trayPeak = s.tray.length;

  return { win: isWin(s), moves: s.moves, docks: s.docks, goal: pr.total, done: pr.done, obvious: steps ? withDock / steps : 0, firstDock,

function randomRun(li, seed){ return playBot(createState(li), 'random', seed); }
function noviceRun(li, seed){ return playBot(createState(li), 'novice', seed); }

// level_overrides: { "12": { "want": 0.5, "help": 0.8, "figs": 14, "cap": 4, "colors": 4, "deal": "each", "assist": 0.5 } } — точечная правка
// генерируемого уровня таблицы без сборки (уроки с ручным полем и блок не трогаются). Ложится поверх глобальных ручек (tuneSpec, spec.ov):
// figs — точное число фигур (figs_scale на него не действует). Поля и пределы — в LIM; неверное поле пропускается.
function applyLevelOverrides(o, onApply){   // в ядре (17.11) — чтобы тест проверял тот же разбор; onApply — журнал оболочки
  if (!o || typeof o !== 'object') return;
  const LIM = { want: [0, 1], help: [0, 1], assist: [0, 1], seed: [0, 1e6], cap: [2, 6], colors: [2, 5], figs: [3, 60], osz: [1, 3], show: [1, 3], pairs: [2, 6], stones: [0, 4] };
  const FRAC = ['want', 'help', 'assist'];
  for (const key of Object.keys(o)){
    const li = parseInt(key, 10) - 1, ov = o[key]; if (!(li >= 0 && li < LEVELS.length) || !ov || typeof ov !== 'object' || LEVELS[li].layout || LEVELS[li].block) continue;
    const next = {};
    for (const f of Object.keys(LIM)) if (ov[f] !== undefined){ const n = Number(ov[f]); if (isFinite(n) && n >= LIM[f][0] && n <= LIM[f][1]) next[f] = FRAC.includes(f) ? n : Math.round(n); }
    if (ov.deal === 'each' || ov.deal === 'miss') next.deal = ov.deal;
    if (Object.keys(next).length){ LEVELS[li] = { ...LEVELS[li], ov: { ...(LEVELS[li].ov || {}), ...next } }; if (onApply) onApply(li + 1, next); }
  }
}

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const CANDY_SND = SKIN === 'candy';   // candy: стыковка и звяк в заказе — «хрустально-сахарные» (остальные звуки общие)   // пентатоника для щелчков по счёту стыковок
const Audio = {
  ac: null, noiseBuf: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended' && !G.paused) this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; return; }
    const len = Math.floor(this.ac.sampleRate * 0.5), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), rnd = mulberry32(99);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    this.noiseBuf = buf;
  },
  on(){ return this.ac && !G.save.muted && !G.paused; },
  suspend(){ try { if (this.ac && this.ac.state === 'running') this.ac.suspend(); } catch (e) {} },
  wake(){ try { if (this.ac && this.ac.state === 'suspended' && !G.paused) this.ac.resume(); } catch (e) {} },
  tone(freq, ms, type, delay, vol, toFreq){
    if (!this.on()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(e + 0.02);
  },
  hiss(ms, f0, f1, delay, vol, type){
    if (!this.on() || !this.noiseBuf) return;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    src.buffer = this.noiseBuf; f.type = type || 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, e);
    src.connect(f).connect(g).connect(this.ac.destination); src.start(t); src.stop(e + 0.02);
  },
  swipe(ms){ this.hiss(Math.max(80, ms), 900, 2400, 0, 0.12); log('sound', 'swipe'); },
  thunk(delay, dist){ const f = 200 - Math.min(5, dist || 1) * 14; this.tone(f, 100, 'sine', delay, 0.32, f * 0.5); this.hiss(50, 700, 250, delay, 0.1); log('sound', 'thunk'); },
  click(k, delay, combo){                            // «щёлк» стыковки: сухой клик + аккорд, выше с каждой фигурой и серией
    const f = NOTES[Math.min(k + Math.max(0, (combo || 1) - 1), NOTES.length - 1)];
    if (CANDY_SND){                                  // candy: «хрустально-сахарный» — короткий хруст сахара + стеклянный звон с негармоническими обертонами
      this.hiss(40, 8000, 4500, delay, 0.3, 'highpass'); this.hiss(28, 3200, 2200, delay + 0.012, 0.16, 'bandpass');
      this.tone(f * 2, 520, 'sine', delay + 0.02, 0.13); this.tone(f * 2 * 2.76, 300, 'sine', delay + 0.022, 0.045);
      this.tone(f * 3, 340, 'triangle', delay + 0.05, 0.05); this.tone(f * 4.07, 200, 'sine', delay + 0.07, 0.03);
      if ((combo || 1) >= 2) [5, 6, 8].forEach((m, i) => this.tone(f * m, 120, 'sine', delay + 0.1 + i * 0.045, 0.025));   // серия — искристые колокольчики
      log('sound', 'click', 'k=' + k + ' combo=' + combo + ' candy'); return;
    }
    this.hiss(30, 5000, 3500, delay, 0.4, 'highpass');
    this.tone(f, 300, 'triangle', delay + 0.03, 0.22);
    this.tone(f * 1.5, 260, 'sine', delay + 0.06, 0.1);
    this.tone(f * 2, 200, 'sine', delay + 0.09, 0.07);
    if ((combo || 1) >= 2) this.hiss(260, 6000, 9000, delay + 0.08, 0.06, 'highpass');   // искристый хвост серии
    log('sound', 'click', 'k=' + k + ' combo=' + combo);
  },
  order(delay){ [784, 1047, 1319].forEach((f, i) => this.tone(f, 150, 'triangle', delay + i * 0.06, 0.14)); log('sound', 'order'); },
  tray(delay){ this.tone(330, 110, 'sine', delay, 0.16, 220); this.hiss(40, 900, 500, delay, 0.08); log('sound', 'tray'); },
  over(delay){ this.tone(160, 260, 'sawtooth', delay, 0.12, 90); this.tone(120, 300, 'square', delay + 0.05, 0.06, 70); log('sound', 'over'); },
  magnet(){ this.tone(260, 300, 'sine', 0, 0.14, 880); this.hiss(200, 1500, 5000, 0.05, 0.05, 'highpass'); log('sound', 'magnet'); },
  broom(){ this.hiss(380, 2600, 700, 0, 0.22); this.hiss(200, 5000, 2500, 0.1, 0.08, 'highpass'); log('sound', 'broom'); },
  revive(){ [392, 523, 659, 784].forEach((f, i) => this.tone(f, 160, 'triangle', i * 0.07, 0.14)); log('sound', 'revive'); },
  coin(delay){ if (CANDY_SND){ this.tone(2637, 180, 'sine', delay, 0.09); this.tone(2637 * 2.76, 110, 'sine', delay + 0.005, 0.03); this.tone(3136, 160, 'sine', delay + 0.05, 0.06); log('sound', 'slot'); return; }   // candy: леденец звякнул о леденец
    this.tone(1568, 60, 'square', delay, 0.04); this.tone(2093, 140, 'sine', delay + 0.04, 0.12); log('sound', 'slot'); },
  star(i, delay){ const f = NOTES[2 + i * 2]; this.tone(f, 320, 'triangle', delay, 0.2); this.tone(f * 2, 240, 'sine', delay + 0.02, 0.08); log('sound', 'star', 'i=' + i); },
  fanfare(delay){
    delay = Math.max(0, delay || 0);
    [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 200, 'triangle', delay + i * 0.08, 0.18));
    [523, 659, 784, 1047].forEach((f) => this.tone(f, 900, 'sine', delay + 0.42, 0.1));
    [1047, 1319, 1568].forEach((f, i) => this.tone(f, 260, 'triangle', delay + 0.42 + i * 0.05, 0.07));

    log('sound', 'fanfare');
  },
  crack(delay){ this.hiss(140, 900, 300, delay, 0.35, 'lowpass'); this.tone(240, 90, 'square', delay, 0.06, 120); log('sound', 'crack'); },
  clink(delay){ this.tone(2400, 70, 'square', delay, 0.05); this.tone(3100, 120, 'triangle', delay + 0.05, 0.06); log('sound', 'clink'); },
  petrify(delay){ this.tone(120, 260, 'sawtooth', delay, 0.1, 60); this.hiss(260, 500, 150, delay, 0.2, 'lowpass'); log('sound', 'petrify'); },
  press(){ this.tone(660, 45, 'triangle', 0, 0.07, 520); },                                   // нажатие кнопки (без строки в журнале — их много)
  pop(){ this.tone(520, 90, 'sine', 0, 0.14, 1040); this.tone(1320, 80, 'triangle', 0.05, 0.06); log('sound', 'pop'); },
  tick(fin){ if (!this.on()) return; const t = performance.now(); if (!fin && t - (this.lastTick || 0) < 45) return; this.lastTick = t; this.tone(fin ? 1320 : 1760, fin ? 70 : 28, 'square', 0, fin ? 0.05 : 0.025); },   // тиканье набегающих цифр
  latch(delay){ delay = Math.max(0, delay || 0); this.tone(2600, 22, 'square', delay, 0.025); this.tone(1700, 40, 'triangle', delay + 0.03, 0.03); },   // захват: щелчок стопора — держит
  clack(delay){ delay = Math.max(0, delay || 0); this.tone(700, 45, 'square', delay, 0.035, 420); this.hiss(1200, 3000, 120, delay, 0.05, 'bandpass'); },   // захват разжался
  rocket(delay, vol){ delay = Math.max(0, delay || 0); vol = vol || 1; this.tone(900, 420, 'sine', delay, 0.035 * vol, 2600); this.hiss(1500, 5000, 420, delay, 0.05 * vol, 'highpass'); },   // royal-салют: свист взлёта
  boom(delay, vol){ delay = Math.max(0, delay || 0); vol = vol || 1; this.tone(90, 260, 'sine', delay, 0.28 * vol, 40); this.hiss(200, 1800, 380, delay, 0.3 * vol, 'lowpass'); this.hiss(3000, 9000, 700, delay + 0.06, 0.07 * vol, 'highpass'); },   // хлопок и треск
  cannon(delay){ delay = Math.max(0, delay || 0); this.hiss(160, 600, 120, delay, 0.32, 'lowpass'); this.tone(110, 140, 'sine', delay, 0.25, 50); this.hiss(700, 4000, 9000, delay + 0.08, 0.06, 'highpass'); log('sound', 'cannon'); },
  intro(){ [392, 523, 659].forEach((f, i) => this.tone(f, 120, 'sine', i * 0.06, 0.08)); log('sound', 'intro'); },
  squelch(delay){ this.hiss(240, 1100, 160, delay, 0.3, 'lowpass'); this.tone(230, 190, 'sine', delay, 0.22, 70); this.tone(150, 130, 'triangle', delay + 0.08, 0.09, 300); log('sound', 'squelch'); },   // «чавк» мёда
  plop(delay){ this.tone(720, 120, 'sine', delay, 0.16, 300); log('sound', 'plop'); },
  nope(){ this.tone(140, 70, 'square', 0, 0.05); log('sound', 'nope'); },
  undo(){ this.hiss(120, 2400, 900, 0, 0.1); log('sound', 'undo'); },
  win(){ this.tone(1047, 200, 'triangle', 0, 0.12); log('sound', 'win'); },
  lose(){ this.tone(330, 220, 'triangle', 0, 0.16, 220); this.tone(220, 360, 'triangle', 0.18, 0.16, 140); log('sound', 'lose'); },
};
function buzz(ms){ if (G.save.haptics === false) return; if (ROYAL) ms = Array.isArray(ms) ? CFG.BUZZ_MS : Math.min(ms, CFG.BUZZ_MS + 3); /* royal: один мягкий импульс */ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// Отладочное в меню, на экранах и в кнопках — только в DEV (в сборке для стора блоки вырезаны, функции остаются пустыми).

    c.moveTo(cx, cy + R * 0.9);
    c.bezierCurveTo(cx - R * 1.3, cy + R * 0.05, cx - R * 0.8, cy - R * 1.05, cx, cy - R * 0.42);
    c.bezierCurveTo(cx + R * 0.8, cy - R * 1.05, cx + R * 1.3, cy + R * 0.05, cx, cy + R * 0.9);

    c.arc(cx, cy, R * 0.86, 0, Math.PI * 2);
  } else if (SHAPES[col] === 'star'){
    for (let k = 0; k < 10; k++){

      c.lineTo(cx + Math.cos(a) * rr2, cy + 0.08 * R + Math.sin(a) * rr2);

    c.moveTo(cx, cy - R); c.lineTo(cx + R * 0.78, cy); c.lineTo(cx, cy + R); c.lineTo(cx - R * 0.78, cy);

function nine(c, im, x, y, w, h, b, d){

  const sx = [0, b, iw - b, iw], sy = [0, b, ih - b, ih], dx = [x, x + d, x + w - d, x + w], dy = [y, y + d, y + h - d, y + h];
  for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++){

    if (sw > 0 && sh > 0 && dw > 0 && dh > 0) c.drawImage(im, sx[i], sy[j], sw, sh, dx[i], dy[j], dw + (i < 2 ? 0.5 : 0), dh + (j < 2 ? 0.5 : 0));

}
// Спрайт фигуры вписан в тот же контур, что и векторная фигура: высота в долях R и сдвиг центра — чтобы срез половинки и свечение совпадали с картинкой.
const SHAPE_FIT = { heart: [1.78, 0.03], circle: [1.74, 0], star: [1.9, 0.02], diamond: [2.0, 0], drop: [1.92, -0.04], rainbow: [1.74, 0] };
function drawShape(c, col, cx, cy, R){

    c.save(); c.clip(); const bands = 5, top = cy - R, hh = (2 * R) / bands;

    c.restore(); shapePath(c, col, cx, cy, R);

// Candy: скол на ровном крае половинки — светлая сахарная кромка с неровным (зубчатым) внутренним краем, яркая линия по самому срезу
// и пара искр. Рисуется внутри уже обрезанной по фигуре половинки; зубцы фиксированы (от стороны), чтобы не мерцали.
const FRACT = [0.55, 1, 0.4, 0.85, 0.5, 1, 0.35, 0.8, 0.6, 0.95, 0.45, 0.9, 0.55, 1, 0.4, 0.75];

  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = Math.max(1, R * 0.03); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.95)'; const lw = Math.max(1.2, R * 0.05);   // сама кромка среза — ярче всего

  for (const [a, d] of [[0.3, 0.5], [0.62, 0.3]]){ q = P2(L * a, w * d); sparkIconFill(c, q[0], q[1], R * 0.09, '#ffffff'); }
  if (side === 1 || side === 3){                     // правая/нижняя: впечённый блик целого (сверху слева) остался на другой половине — свой блик-«окно»
    const o = (side === 1 ? HL_R : HL_B)[SHAPES[col]] || [0.3, -0.4], hx = ex + R * o[0], hy = ey + R * o[1];
    c.save(); c.translate(hx, hy); c.rotate(-0.62);

// Где блик у правой (HL_R) и нижней (HL_B) половинки: сдвиг от середины ровного края в долях R — верх-лево видимой части, внутри толстой части фигуры.
const HL_R = { heart: [0.42, -0.42], circle: [0.3, -0.44], star: [0.17, -0.22], diamond: [0.14, -0.3], drop: [0.2, -0.16], rainbow: [0.3, -0.44] };
const HL_B = { heart: [-0.36, 0.14], circle: [-0.42, 0.24], star: [-0.24, 0.12], diamond: [-0.16, 0.18], drop: [-0.4, 0.26], rainbow: [-0.42, 0.24] };
// Скол кэшируется картинкой по цвету, стороне и размеру на экране (масштаб квантуется шагом 0,25 — анимации не плодят записи): путь с зубцами
// на каждой половинке каждый кадр стоил +0,4 мс кадра к royal. Картинка (Image из toDataURL), а не холст: холст-источник при программном
// игровом холсте читается обратно на каждом drawImage (кадр 4,7 мс). Пока картинка декодируется — null, drawHalf рисует путём.
const FRACT_CACHE = new Map();
function fractSprite(c, col, side, R){

    shapePath(x, col, o, o, R); x.clip(); candyFracture(x, side, o, o, R, col);
    const im = new Image(); e = { im, o, ok: false }; im.onload = () => { e.ok = true; }; im.src = cv2.toDataURL(); FRACT_CACHE.set(key, e);

// Candy (18.11, Андрей: «не хватает объёма»): мягкая тень под леденцом — силуэт спрайта, затемнённый в цвет леденца, размытый и сдвинутый вниз:
// леденец стоит на монетке, а не напечатан на ней. Только под фишками заказов и лотка: на плитке поля леденец почти во всю высоту — тень
// уходит за край плитки и не видна, а кадр дороже на 0,6 мс. Кэш картинкой, как у скола; размытие — shadowBlur (canvas filter есть не во всех Safari).
const SHADOW_CACHE = new Map();
function candyShadow(c, col, cx, cy, R){

  const m = c.getTransform(), k = Math.ceil(Math.max(Math.abs(m.a), Math.abs(m.d)) * 4) / 4, key = col + '|' + Math.round(R * k);
  let e = SHADOW_CACHE.get(key);

    if (SHADOW_CACHE.size > 120) SHADOW_CACHE.clear();
    const o = R * 1.6, n = Math.max(2, Math.ceil(o * 2 * k)), cv2 = document.createElement('canvas'); cv2.width = cv2.height = n;
    const x = cv2.getContext('2d'), f = n / (o * 2), sil = document.createElement('canvas'); sil.width = sil.height = n;
    const y = sil.getContext('2d'); y.scale(f, f); drawShape(y, col, o, o, R);                     // силуэт: спрайт, закрашенный цветом тени

// Candy: блик — светлая косая полоса пробегает по фигуре (u 0…1 — положение), обрезана по контуру. Стыковка и полёт в заказ.
function candyGlint(c, col, x, y, R, u, a){
  if (a <= 0 || u <= 0 || u >= 1) return;

// Точка ровного края половинки в клетке (x, y) размера s с отступом pad.
function halfEdge(code, x, y, s, pad){
  const sd = sideOf(code);
  return sd === 0 ? { x: x + s - pad, y: y + s / 2 } : sd === 1 ? { x: x + pad, y: y + s / 2 } : sd === 2 ? { x: x + s / 2, y: y + s - pad } : { x: x + s / 2, y: y + pad };
}// Плитка с половинкой в клетке (x, y) размера s. Ровный край половинки лежит на краю плитки —
// две соседние плитки «левая | правая» показывают почти целую фигуру с зазором.
// scl — общий масштаб, sx/sy — растяжение по осям (скольжение, сплющивание при остановке).

function drawPiece(c, code, x, y, s, alpha, scl, sx, sy, glow, t){

// Искорка в свободном углу плитки (напротив ровного края) мерцает — плитка нужна открытому заказу.

// Цепь: два перекрещенных ряда звеньев и замочек — плитка не двигается.
function drawChain(c, x, y, s){

// Таймер: кружок с числом у угла, противоположного ровному краю; 1–2 хода — красный и пульсирует.

// ---------- Royal: туториальный фокус (17.11, Андрей: «затемняем всё и показываем кружком там, где надо») ----------

function tutAt(id, t, slot){ if (TUT_ON && !tutSeen(id) && !TUT.due.some(d => d.id === id)) TUT.due.push({ id, t, slot: slot === undefined ? -1 : slot }); }

// Прямоугольник шага в координатах поля (виртуальные юниты холста) или DOM-элемента; null — показывать нечего (шаг пропускается).
function tutRect(id){
  const s = G.s, g = geo(), cs = g.cell; if (!s) return null;
  const cellR = (i) => { const p = cellXY(i, g); return { x: p.x, y: p.y, w: cs, h: cs }; };

  const union = (rs) => { rs = rs.filter(Boolean); if (!rs.length) return null; const x = Math.min(...rs.map(r => r.x)), y = Math.min(...rs.map(r => r.y)); return { x, y, w: Math.max(...rs.map(r => r.x + r.w)) - x, h: Math.max(...rs.map(r => r.y + r.h)) - y }; };

  if (id === 'honey'){                              // урок мёда (18.11): шаг 1 — пятно на пути плитки до мёда, рука показывает свайп

function tutHole(id){                               // пятно в координатах #frame (CSS px), не вылезает за края экрана
